<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Mina Skolarbeten</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; padding-top: 50px; }
        h1 { color: #1DB954; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 10px; display: inline-block; margin: 20px; width: 300px; text-align: left; }
        a { color: #1DB954; text-decoration: none; font-weight: bold; }
        iframe { width: 100%; height: 80px; border: none; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Välkommen till min studiesida</h1>
    <p>Här sparar jag mina länkar för skolarbeten.</p>

    <!-- Musik-del (Inbäddad SoundCloud) -->
    <div class="box">
        <h3>🎵 Min Studiemusik</h3>
        <iframe src="https://soundcloud.com"></iframe>
    </div>

    <!-- Proxy-del (Gömda tunnlar för att öppna Spotify) -->
    <div class="box">
        <h3>🔍 Sökverktyg</h3>
        <p>Använd dessa länkar för att söka efter material:</p>
        <p>• <a href="https://croxyproxy.com" target="_blank">Tunnel 1 (Öppna Spotify här)</a></p>
        <p>• <a href="https://proxyium.com" target="_blank">Tunnel 2 (Reserv)</a></p>
    </div>

</body>
</html>
