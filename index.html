<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Mina Skolarbeten & Musik</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0f0f; color: #f0f0f0; text-align: center; padding-top: 40px; }
        h1 { color: #1DB954; font-size: 28px; }
        p { color: #aaa; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .box { background: #1a1a1a; padding: 20px; border-radius: 12px; width: 340px; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h3 { margin-top: 0; color: #fff; border-bottom: 1px solid #333; padding-bottom: 8px; }
        iframe { width: 100%; height: 180px; border: none; border-radius: 8px; margin-top: 10px; }
        .safe-note { font-size: 12px; color: #666; margin-top: 25px; }
    </style>
</head>
<body>

    <h1>📚 Mina Skolarbeten</h1>
    <p>Denna sida är till för skolarbeten, planering och bakgrundsmusik.</p>

    <div class="container">
        <!-- Spellista 1: Fransk Urban Pop (Marwa Loud, Nej, Vegedream m.fl) -->
        <div class="box">
            <h3>🎵 Fransk Pop & HipHop</h3>
            <p>Inkluderar vibes som Paro och Bad Boy.</p>
            <iframe src="https://soundcloud.com"></iframe>
        </div>

        <!-- Spellista 2: Träning & Fokus -->
        <div class="box">
            <h3>⚡ Energi & Beats</h3>
            <p>Snabbare låtar för att hålla igång under plugget.</p>
            <iframe src="https://soundcloud.com"></iframe>
        </div>
    </div>

    <p class="safe-note">Denna sida är 100% säker och laddas krypterat via GitHub utan externa skript.</p>

</body>
</html>
